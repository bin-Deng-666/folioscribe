name: checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -e '.[dev,annotation]'
      - run: python -m pytest -q --ignore=tests/browser
      - run: ruff check .
      - run: node --check components/annotation/viewer/static/app.js
      - run: python -m build
      - name: Verify wheel contains the viewer
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          with ZipFile(next(Path('dist').glob('*.whl'))) as wheel:
              names = set(wheel.namelist())
              for name in ('ocr_agent_viewer/server.py', 'ocr_agent_viewer/static/index.html',
                           'ocr_agent_viewer/static/app.js', 'sft/output_format.py'):
                  assert name in names, name
          PY
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev,browser]'
      - run: python -m playwright install --with-deps chromium
      - run: python -m pytest -q tests/browser
